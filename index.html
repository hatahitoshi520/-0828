/* ============================================================
   window.storage の Supabase 版ポリフィル
   ------------------------------------------------------------
   PosRegister.jsx 側のコードは一切変更していません。
   window.storage.get / window.storage.set という同じ形の
   関数をここで用意し、中身だけ Supabase の REST API に
   つなげています。SUPABASE_URL と SUPABASE_ANON_KEY は
   一度設定したら、今後コードを更新しても変わりません。
   ============================================================ */
const SUPABASE_URL = "https://txfzylywpdrcpashiwae.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YqEkc-SyynhhH3GttVqq6Q_Uf9PeuVr";

async function sbFetchRow(key) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/app_state?id=eq.${encodeURIComponent(key)}&select=data,updated_at`,
    { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
  );
  const rows = await res.json();
  return rows && rows[0] ? rows[0] : null;
}

async function sbUpsertRow(key, dataObj) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?on_conflict=id`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=minimal",
    },
    body: JSON.stringify({ id: key, data: dataObj, updated_at: new Date().toISOString() }),
  });
  return res.ok;
}

let _lastKnownUpdatedAt = null;

window.storage = {
  get: async (key /*, shared */) => {
    try {
      const row = await sbFetchRow(key);
      if (!row) return null;
      _lastKnownUpdatedAt = row.updated_at;
      return { key, value: JSON.stringify(row.data), shared: true };
    } catch (e) {
      console.error("storage.get failed", e);
      return null;
    }
  },
  set: async (key, value /*, shared */) => {
    try {
      const parsed = JSON.parse(value);
      const ok = await sbUpsertRow(key, parsed);
      if (!ok) return null;
      _lastKnownUpdatedAt = new Date().toISOString();
      return { key, value, shared: true };
    } catch (e) {
      console.error("storage.set failed", e);
      return null;
    }
  },
  delete: async () => null,
  list: async () => ({ keys: [] }),
};

/* 他の端末がデータを更新したら、20秒ごとに検知して自動でページを再読込します。
   ※ 入力途中の未確定な下書き（例：買い出しの品名欄など）は失われる場合が
   ありますが、確定済みの注文・経費・シフトなどは全て保存済みなので消えません。 */
const SUZU_STORAGE_KEY = "kissa-suzu-pos-store";
setInterval(async () => {
  try {
    const row = await sbFetchRow(SUZU_STORAGE_KEY);
    if (row && _lastKnownUpdatedAt && row.updated_at !== _lastKnownUpdatedAt) {
      window.location.reload();
    }
  } catch (e) {
    /* 通信エラーは無視して次回ポーリングでリトライ */
  }
}, 20000);

</script>

  if (!tl) return true;
  const ref = entryTime ? new Date(entryTime) : new Date();

  return tl.start <= tl.end ? h >= tl.start && h < tl.end : h >= tl.start || h < tl.end;
}

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0, 0, 0, 0);
  return date;
}
function weekKeyOf(monday) {
  return monday.toISOString().slice(0, 10);
}

  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const fmt = (d) => d.toLocaleDateString("ja-JP", { month: "2-digit", day: "2-digit" });
  return `${fmt(monday)}〜${fmt(sunday)}`;
}
function ymd(y, m, d) {
  // m は 0-indexed 月
  return `${y}-${m + 1}-${d}`;
}
function todayYmd() {
  const n = new Date();
  return ymd(n.getFullYear(), n.getMonth(), n.getDate());
}
function calcShiftHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let mins = eh * 60 + em - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}
function genId(prefix) {
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    if (m.cost && m.cost > 0) costById[m.id] = m.cost;
  });
  let costTotal = 0;
  let costUnknownQty = 0;
  weekOrders.forEach((o) => {
    const dk = dateKey(o.time);
    byDay[dk] = byDay[dk] || { count: 0, total: 0 };
    byDay[dk].count += 1;
    byDay[dk].total += o.total;
    tableCount[o.table] = (tableCount[o.table] || 0) + 1;
    o.lines.forEach((l) => {
      itemCount[l.name] = (itemCount[l.name] || 0) + l.qty;
      if (l.name.includes("おかわり")) refillCount += l.qty;
      if (l.itemId && costById[l.itemId] != null) {
        costTotal += costById[l.itemId] * l.qty;
      } else {
        costUnknownQty += l.qty;
      }
    });
  });
  const topItems = Object.entries(itemCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const hasFullCostData = costUnknownQty === 0 && weekOrders.length > 0;
  return {
    orderCount: weekOrders.length,
    total,
    byDay,
    topItems,
    tableCount,
    refillCount,
    costTotal,
    costUnknownQty,
    hasFullCostData,
    grossProfit: hasFullCostData ? total - costTotal : null,
    grossMarginPct: hasFullCostData && total > 0 ? Math.round(((total - costTotal) / total) * 1000) / 10 : null,
  };
}
function buildMonthStats(orders, monthDate) {
  const start = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const end = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 1);
  const monthOrders = orders.filter((o) => o.time >= start.getTime() && o.time < end.getTime());
  const total = monthOrders.reduce((s, o) => s + o.total, 0);
  return {
    label: `${start.getFullYear()}年${start.getMonth() + 1}月`,
    orderCount: monthOrders.length,
    total,
  };
}
function buildDailyStats(orders, days = 14) {
  const map = {};
  orders.forEach((o) => {
    const dk = dateKey(o.time);
    map[dk] = map[dk] || { count: 0, total: 0, ts: o.time };
    map[dk].count += 1;
    map[dk].total += o.total;
  });
  return Object.entries(map)
    .sort((a, b) => b[1].ts - a[1].ts)
    .slice(0, days);
}

async function callClaudeForWeeklyReport(stats, weekLabel, weekRange, storeArea, monthCompare) {
  const dayLines = Object.entries(stats.byDay)
    .map(([d, v]) => `${d}: ${v.count}件 ${v.total}円`)
    .join("\n");
  const itemLines = stats.topItems.map(([n, q]) => `${n} ${q}点`).join("、");
  const tableLines = Object.entries(stats.tableCount)
    .map(([t, c]) => `卓${t}:${c}回`)
    .join("、");
  const costLines = stats.hasFullCostData
    ? `原価合計: ${stats.costTotal}円 / 粗利: ${stats.grossProfit}円 / 粗利率: ${stats.grossMarginPct}%`
    : `原価データ不足のため算出不可（原価未設定の商品が${stats.costUnknownQty}点含まれています。品目管理タブで原価を設定すると収益性分析が可能になります）`;
  const monthLines = monthCompare
    ? `今月(${monthCompare.current.label})累計: ${monthCompare.current.total}円 / ${monthCompare.current.orderCount}件\n先月(${monthCompare.prev.label})累計: ${monthCompare.prev.total}円 / ${monthCompare.prev.orderCount}件`
    : "月次比較データなし";
  const areaLine = storeArea && storeArea.trim() ? storeArea.trim() : null;

  const prompt = `あなたは飲食店経営歴20年以上の経営コンサルタント、かつ飲食業界に強いマーケティングの専門家です。喫茶店「喫茶すず〜」のオーナーから、週次データをもとにした経営分析と改善提案を依頼されました。

以下は${weekLabel}（${weekRange.startLabel}〜${weekRange.endLabel}）の実績データです。

・合計売上: ${stats.total}円
・会計件数: ${stats.orderCount}件
・日別実績:
${dayLines || "データなし"}
・人気商品(点数順): ${itemLines || "データなし"}
・卓別利用回数: ${tableLines || "データなし"}
・早朝おかわり(5:00-7:00入店限定)利用: ${stats.refillCount}点
・収益性: ${costLines}
・月次比較: ${monthLines}

${
  areaLine
    ? `店舗エリアは「${areaLine}」です。web検索ツールを使って、${weekRange.startLabel}〜${weekRange.endLabel}の${areaLine}周辺の天気・気温の傾向、およびこの期間中に${areaLine}周辺で開催された（または開催予定の）地域イベント・祭事があれば調べ、来客数や売上への影響を考察する材料にしてください。検索で確実な情報が得られない場合は、その旨を明記し、憶測で断定しないでください。`
    : "店舗エリアが未設定のため天気・気温・地域イベントの検索は行わないでください。"
}
また、web検索ツールを使ってこのエリアの類似業態（喫茶店・カフェ）の一般的な価格帯や集客の工夫について軽く調べ、当店の価格設定や商品構成が同業と比べて極端に外れていないか、参考情報として触れても構いません。ただし他店の実売上・実来客数は取得できないため、あくまで公開情報に基づく一般的な傾向としての言及に留め、断定的な比較は避けてください。

経営とマーケティングのプロとしての視点で、来店実績データを主な根拠に分析・判断してください。数値を捏造せず、データにないことは書かないでください。データが不十分で判断できない項目は「判断材料不足」と明記してください。

日本語で以下の見出しに沿って簡潔にまとめてください。
【今週のポイント】(客数・売上・客単価・月次比較の傾向を専門家として評価。天気やイベントの影響が読み取れれば触れる。2〜3行)
【人気メニュー・卓稼働の分析】(何が売れ筋か、卓の稼働に偏りがないかをプロの視点で解説。1〜2行)
【収益性】(原価データがあれば粗利率を評価、なければ「判断材料不足」と明記。1行)
【周辺環境・同業比較】(天気・地域イベント・簡易な同業比較で得られた材料があれば触れる。情報が得られなければ「該当情報なし」と明記。1〜2行)
【改善提案】(経営コンサルタント/マーケターとして、来週すぐ実行できる具体的な改善アクションを2〜3点、根拠データとセットで提示)

全体で600字以内。断定口調ではなく、プロとしての助言として書いてください。`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      messages: [{ role: "user", content: prompt }],
      tools: areaLine ? [{ type: "web_search_20250305", name: "web_search" }] : undefined,
    }),
  });
  const data = await response.json();
  const text = (data.content || [])
    .map((b) => (b.type === "text" ? b.text : ""))
    .filter(Boolean)
    .join("\n")
    .trim();
  if (!text) throw new Error("empty response");
  return text;
}

  const buyBoughtCount = buyLists.flatMap((c) => c.items).filter((i) => getBuyItem(i.id).bought).length;

  /* ============================================================

  const staffWage = (name) => {

  const addStaff = async () => {

    showFlash(`${name}さんを追加しました（時給¥1,200）`);

  const removeStaff = async (name) => {
    if (!window.confirm(`${name}さんをスタッフ一覧から削除しますか？（過去のシフト記録は残ります）`)) return;
    const next = shiftStaff.filter((s) => s.name !== name);
    setShiftStaff(next);
    await persistAll({ shiftStaff: next });

  const updateStaffWage = async (name, wage) => {
    const w = Math.max(0, parseInt(wage, 10) || 0);
    const next = shiftStaff.map((s) => (s.name === name ? { ...s, wage: w } : s));
    setShiftStaff(next);
    await persistAll({ shiftStaff: next });
  };
  const shiftChangeMonth = (delta) => {
    setShiftViewYM((cur) => {
      let m = cur.m + delta;
      let y = cur.y;
      if (m < 0) {
        m = 11;
        y--;
      }
      if (m > 11) {
        m = 0;
        y++;
      }
      return { y, m };
    });
  };
  const addShiftEntry = async (staff, start, end) => {
    if (!staff || !start || !end) {
      showFlash("担当者・時間を入力してください");
      return;
    }
    const [y, m, d] = shiftSelDate.split("-").map(Number);
    const next = { ...shiftEntries };
    if (shiftAddMode === "weekly") {
      const groupId = genId("g");
      const lastDay = new Date(y, m, 0).getDate();
      let count = 0;
      for (let day = d; day <= lastDay; day += 7) {
        const key = ymd(y, m - 1, day);
        next[key] = [...(next[key] || []), { id: genId("s"), staff, start, end, groupId }];
        count++;
      }
      setShiftEntries(next);
      await persistAll({ shiftEntries: next });
      showFlash(`${staff}さんのシフトを毎週${count}件登録しました`);
    } else {
      next[shiftSelDate] = [...(next[shiftSelDate] || []), { id: genId("s"), staff, start, end }];
      setShiftEntries(next);
      await persistAll({ shiftEntries: next });
      showFlash(`${staff}さんのシフトを追加しました`);
    }
  };
  const removeShiftEntry = async (dateKey2, id) => {
    const next = { ...shiftEntries };
    next[dateKey2] = (next[dateKey2] || []).filter((e) => e.id !== id);
    if (next[dateKey2].length === 0) delete next[dateKey2];
    setShiftEntries(next);
    await persistAll({ shiftEntries: next });
  };
  const removeShiftGroup = async (groupId) => {
    if (!window.confirm("この毎週固定シフトをまとめて削除しますか？")) return;
    const next = {};
    Object.entries(shiftEntries).forEach(([k, list]) => {
      const filtered = list.filter((e) => e.groupId !== groupId);
      if (filtered.length) next[k] = filtered;
    });
    setShiftEntries(next);
    await persistAll({ shiftEntries: next });
  };
  const submitShiftRequest = async () => {
    if (!reqDraft.date || !reqDraft.staff) {
      showFlash("日付と担当者を選んでください");
      return;
    }
    const next = [...shiftRequests, { id: genId("r"), ...reqDraft }];
    setShiftRequests(next);
    setReqDraft({ ...reqDraft, note: "" });
    await persistAll({ shiftRequests: next });
    showFlash("希望を提出しました");
  };
  const removeShiftRequest = async (id) => {
    const next = shiftRequests.filter((r) => r.id !== id);
    setShiftRequests(next);
    await persistAll({ shiftRequests: next });
  };
  const calcMonthlyPayroll = (y, m) => {
    const prefix = `${y}-${m + 1}-`;
    const result = {};
    Object.entries(shiftEntries).forEach(([key, list]) => {
      if (!key.startsWith(prefix)) return;
      // 「1-1」と「1-10」の混同を避けるため、日部分まで厳密一致で確認
      const restOk = key.slice(prefix.length).match(/^\d+$/);
      if (!restOk) return;
      list.forEach((e) => {
        if (!result[e.staff]) result[e.staff] = { hours: 0, shiftCount: 0 };
        result[e.staff].hours += calcShiftHours(e.start, e.end);
        result[e.staff].shiftCount += 1;
      });
    });
    Object.keys(result).forEach((name) => {
      const w = staffWage(name);
      result[name].wage = w;
      result[name].pay = Math.round(result[name].hours * w);
    });
    return result;
  };
  const monthlyLaborCost = (y, m) => Object.values(calcMonthlyPayroll(y, m)).reduce((s, p) => s + p.pay, 0);
  const yearlyLaborCost = (y) => {
    let sum = 0;
    for (let m = 0; m < 12; m++) sum += monthlyLaborCost(y, m);
    return sum;
  };
  const getDaySales = (y, m, d) => {

    return orders

  const expenseYears = [...new Set(expenses.map((e) => e.date.slice(0, 4)))].sort().reverse();
  const activeExpYear = expenseYears.includes(expYearFilter) ? expYearFilter : expenseYears[0] || String(new Date().getFullYear());
  const activeTaxYear = expenseYears.includes(taxYear) ? taxYear : expenseYears[0] || String(new Date().getFullYear());

  const buildTaxSummary = (year) => {
    const yearReceiptsTotal = orders
      .filter((o) => new Date(o.time).getFullYear() === Number(year))
      .reduce((s, o) => s + o.total, 0);
    const yExps = expenses.filter((e) => e.date.startsWith(year));
    const catTotals = {};
    yExps.forEach((e) => {
      catTotals[e.cat] = (catTotals[e.cat] || 0) + e.amount;
    });
    const laborCost = yearlyLaborCost(Number(year));
    const expenseTotal = Object.values(catTotals).reduce((s, v) => s + v, 0) + laborCost;
    const profit = yearReceiptsTotal - expenseTotal;
    return { sales: yearReceiptsTotal, catTotals, laborCost, expenseTotal, profit };
  };

  const copyTaxReturnText = async (year) => {

  const downloadCsv = (filename, rows) => {
    const csv = rows
      .map((r) => r.map((v) => {
        const s = String(v ?? "");
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(","))
      .join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const exportExpenseCsv = (year) => {

  const exportPLCsv = (year) => {

    EXPENSE_CATEGORIES.forEach((c) => {

    rows.push(["　給料賃金（人件費）", s.laborCost]);
    rows.push(["経費合計", s.expenseTotal]);
    rows.push([]);
    rows.push(["事業利益（概算）", s.profit]);

  /* ============================================================
     ★ 旧システム（localStorage版・複数キー方式）からのデータ移行
     ============================================================
     旧システムは suzu_receipts_v2 / suzu_expenses_v1 / suzu_shift_staff_v1 /
     suzu_shift_entries_v1 / suzu_shift_requests_v1 / suzu_shift_wages_v1 /
     suzu_buy_done_v4 などのキーに分かれてデータを保持している。
     ここでは、それらをまとめてエクスポートしたJSONを読み込み、
     このPOSのデータ構造に変換したうえで「追記マージ」する。
     既存データは消さず、重複だけを避けて合体させる。
  */
  const legacyOrderStringToLines = (orderStr) =>
    (orderStr || "")
      .split("/")
      .map((s) => s.trim())
      .filter(Boolean)
      .map((part) => {
        const m = part.match(/^(.+?)×(\d+)$/);
        return m ? { name: m[1], qty: parseInt(m[2], 10), price: 0, itemId: null } : { name: part, qty: 1, price: 0, itemId: null };
      });

  const transformLegacyReceipts = (list) =>
    (list || []).map((r) => {
      const time = r.savedAt ? new Date(r.savedAt).getTime() : Date.now();
      return {
        id: "legacy-" + (r.savedAt || genId("o")),
        time,
        label: (r.date || "") + " " + (r.time || ""),
        table: r.table || "-",
        entryLabel: r.timeIn || "-",
        lines: legacyOrderStringToLines(r.order),
        total: Number(r.grand) || 0,
      };
    });

  const transformLegacyExpenses = (list) =>
    (list || []).map((e) => ({
      id: "legacy-" + (e.savedAt || genId("e")),
      date: e.date,
      cat: e.cat === "食材・仕入" ? "仕入高" : e.cat === "光熱費" ? "水道光熱費" : e.cat === "消耗品" ? "消耗品費" : e.cat === "その他" ? "雑費" : e.cat,
      name: e.name,
      amount: Number(e.amount) || 0,
      receiptNo: e.receiptNo || "",
    }));

  const transformLegacyStaff = (staffNames, wages) =>
    (staffNames || []).map((name) => ({ name, wage: (wages && wages[name]) || DEFAULT_HOURLY_WAGE }));

  const transformLegacyShiftEntries = (entries) => {
    const out = {};
    Object.entries(entries || {}).forEach(([key, list]) => {
      out[key] = (list || []).map((e) => ({ id: e.id || genId("s"), staff: e.staff, start: e.start, end: e.end, groupId: e.groupId }));
    });
    return out;
  };

  const transformLegacyShiftRequests = (list) =>
    (list || []).map((r) => ({ id: "legacy-" + (r.savedAt || genId("r")), date: r.date, staff: r.staff, type: r.type, note: r.note || "" }));

  const runImport = async (raw) => {
    setImportMsg("読み込み中...");
    setImportMsgType("load");
    try {
      const data = JSON.parse(raw);

      // 旧receipts → orders（IDの重複は除外して追記）
      const legacyOrders = transformLegacyReceipts(data.suzu_receipts_v2);
      const existingOrderIds = new Set(orders.map((o) => o.id));
      const mergedOrders = [...orders, ...legacyOrders.filter((o) => !existingOrderIds.has(o.id))].sort((a, b) => b.time - a.time);

      // 旧expenses → expenses（追記）
      const legacyExpenses = transformLegacyExpenses(data.suzu_expenses_v1);
      const existingExpIds = new Set(expenses.map((e) => e.id));
      const mergedExpenses = [...expenses, ...legacyExpenses.filter((e) => !existingExpIds.has(e.id))];

      // 旧スタッフ・時給 → shiftStaff（名前が同じなら既存を優先、無ければ追加）
      const legacyStaff = transformLegacyStaff(data.suzu_shift_staff_v1, data.suzu_shift_wages_v1);
      const existingStaffNames = new Set(shiftStaff.map((s) => s.name));
      const mergedStaff = [...shiftStaff, ...legacyStaff.filter((s) => !existingStaffNames.has(s.name))];

      // 旧シフト予定 → shiftEntries（日付キーごとに配列を連結、id重複は除外）
      const legacyEntries = transformLegacyShiftEntries(data.suzu_shift_entries_v1);
      const mergedEntries = { ...shiftEntries };
      Object.entries(legacyEntries).forEach(([key, list]) => {
        const existingIds = new Set((mergedEntries[key] || []).map((e) => e.id));
        mergedEntries[key] = [...(mergedEntries[key] || []), ...list.filter((e) => !existingIds.has(e.id))];
      });

      // 旧休み希望 → shiftRequests（追記）
      const legacyRequests = transformLegacyShiftRequests(data.suzu_shift_requests_v1);
      const existingReqIds = new Set(shiftRequests.map((r) => r.id));
      const mergedRequests = [...shiftRequests, ...legacyRequests.filter((r) => !existingReqIds.has(r.id))];

      // 旧買い出しチェック状態 → buyState（同じ品目IDならそのままマージ、新しい値で上書き）
      const legacyBuy = data.suzu_buy_done_v4 || {};
      const mergedBuyState = { ...buyState, ...legacyBuy };

      setOrders(mergedOrders);
      setExpenses(mergedExpenses);
      setShiftStaff(mergedStaff);
      setShiftEntries(mergedEntries);
      setShiftRequests(mergedRequests);
      setBuyState(mergedBuyState);

      await persistAll({
        orders: mergedOrders,
        expenses: mergedExpenses,
        shiftStaff: mergedStaff,
        shiftEntries: mergedEntries,
        shiftRequests: mergedRequests,
        buyState: mergedBuyState,
      });

      const addedStaffCount = mergedStaff.length - shiftStaff.length;
      setImportMsg(
        `✅ 移行しました（会計 +${legacyOrders.length}件／経費 +${legacyExpenses.length}件／スタッフ +${addedStaffCount}名／希望 +${legacyRequests.length}件）`
      );
      setImportMsgType("ok");
      setImportText("");
    } catch (e) {
      console.error("import failed", e);
      setImportMsg("読み込みに失敗しました。JSON形式を確認してください。");
      setImportMsgType("err");
    }
  };

  const handleImportFile = (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => runImport(e.target.result);
    reader.readAsText(file);
    ev.target.value = "";

    <div

      style={{ fontFamily: "'Hiragino Sans','Yu Gothic',system-ui,sans-serif" }}
    >
      <header className="px-4 pt-5 pb-3 border-b border-slate-700 flex items-center justify-between">
        <div>
          <div className="text-amber-400 text-xs tracking-[0.3em]">POS REGISTER</div>
          <h1 className="text-lg font-bold tracking-wide">喫茶すず〜 ハンディレジ</h1>
        </div>
        <div className="text-right text-xs text-slate-400">
          <div>本日売上</div>
          <div className="text-amber-300 font-bold text-base">{yen(todayTotal)}</div>
        </div>
      </header>

      {saveError && (
        <div className="bg-rose-900/60 text-rose-200 text-xs px-4 py-2 text-center">
          保存に失敗しました。電波状況を確認してもう一度お試しください。
        </div>
      )}
      {flash && <div className="bg-amber-500 text-slate-900 text-sm font-bold px-4 py-2 text-center">{flash}</div>}
      {analyzingWeek && (
        <div className="bg-teal-900/60 text-teal-200 text-xs px-4 py-2 text-center flex items-center justify-center gap-1">
          <RefreshCw size={12} className="animate-spin" /> 週次AI分析を生成中…
        </div>
      )}

      {tab === "order" && (
        <div className="px-3 pt-3">
          <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5">卓を選択</div>
          <div className="flex gap-1.5 overflow-x-auto pb-2">
            {TABLE_IDS.map((id) => {
              const t = tables[id] || { entryTime: null, cart: {} };
              const qty = Object.values(t.cart || {}).reduce((s, l) => s + l.qty, 0);
              const active = id === activeTableId;
              return (
                <button
                  key={id}
                  onClick={() => setActiveTableId(id)}
                  className={
                    "relative shrink-0 rounded-lg px-3 py-2 text-sm font-bold border " +
                    (active ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-slate-800 border-slate-700 text-stone-200")
                  }
                >
                  卓{id}
                  {qty > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-teal-500 text-white rounded-full text-[10px] w-4 h-4 flex items-center justify-center font-bold">
                      {qty}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
          <div className="flex items-center justify-between bg-slate-800/60 rounded-lg px-3 py-2 mb-2 text-xs">
            <div className="flex items-center gap-2 text-slate-300">
              <Clock size={13} className={refillOk ? "text-teal-300" : "text-slate-500"} />
              入店:{" "}
              {activeTable.entryTime ? (
                <span className="font-bold text-stone-100">{timeLabel(activeTable.entryTime)}</span>
              ) : (
                <span className="text-slate-500">未開卓（初回注文で記録）</span>
              )}
              {refillOk && <span className="text-teal-300 font-bold ml-1">おかわり¥100対象</span>}
            </div>
            <button onClick={resetTable} className="flex items-center gap-1 text-rose-300">
              <RotateCcw size={12} /> リセット
            </button>
          </div>
        </div>
      )}

      <main
        className="flex-1 overflow-y-auto"
        style={{ paddingBottom: (tab === "order" ? cartBarHeight : 0) + 88 }}
      >
        {tab === "order" && (
          <div className="px-3 pb-3 space-y-4">
            {grouped.map(({ cat, items }) => (
              <div key={cat}>
                <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5 border-l-2 border-amber-400 pl-2">
                  {cat}
                </div>
                <div className="grid grid-cols-2 gap-2">
                  {items.map((item) => {
                    const anyOk = item.priceOptions.some((o) => isTimeOkForEntry(o.timeLimited, activeTable.entryTime));
                    const qtyForItem = cartLines.filter((l) => l.itemId === item.id).reduce((s, l) => s + l.qty, 0);
                    return (
                      <button
                        key={item.id}
                        onClick={() => openItem(item)}
                        disabled={!anyOk}
                        className={
                          "relative rounded-xl p-3 text-left border transition active:scale-95 " +
                          (anyOk ? "bg-slate-800 border-slate-700 hover:border-amber-400" : "bg-slate-800/40 border-slate-800 opacity-50")
                        }
                        style={{ minHeight: "72px" }}
                      >
                        <div className="font-bold text-sm leading-snug pr-2">{item.name}</div>
                        <div className="text-amber-300 font-bold mt-1 text-sm">
                          {item.priceOptions.length > 1
                            ? `${yen(Math.min(...item.priceOptions.map((o) => o.price)))}〜`
                            : yen(item.priceOptions[0].price)}
                        </div>
                        {item.variantOptions && (
                          <div className="text-[10px] text-teal-300 mt-0.5">{item.variantOptions.choices.join(" / ")}</div>
                        )}
                        {qtyForItem > 0 && (
                          <div className="absolute -top-2 -left-2 bg-amber-400 text-slate-900 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow">
                            {qtyForItem}
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* ============================================================
            ★ 買い出しリスト タブ
        ============================================================ */}
        {tab === "buy" && (
          <div className="p-3 space-y-3">
            <div className="bg-slate-800/60 rounded-lg p-3 border border-slate-700 flex items-center justify-between text-xs">
              <div className="text-slate-300">
                購入済 <span className="text-amber-300 font-bold">{buyBoughtCount}</span>/{buyTotalCount}　｜　要購入{" "}
                <span className="text-amber-300 font-bold">{buyNeedCount}</span>品目
              </div>
              <button onClick={resetBuyList} className="flex items-center gap-1 text-rose-300">
                <RotateCcw size={12} /> リセット
              </button>
            </div>

            {buyLists.map((cat) => (
              <div key={cat.cat}>
                <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5 border-l-2 border-amber-400 pl-2">
                  {cat.cat}
                </div>
                <div className="bg-slate-800 rounded-lg border border-slate-700 divide-y divide-slate-700">
                  {cat.items.map((item) => {
                    const st = getBuyItem(item.id);
                    return (
                      <div key={item.id} className={"flex items-center gap-2 px-3 py-2 " + (st.bought ? "opacity-40" : "")}>
                        <button
                          onClick={() => toggleBuyBought(item.id)}
                          className={
                            "w-6 h-6 rounded-md border flex items-center justify-center shrink-0 " +
                            (st.bought ? "bg-amber-400 border-amber-500" : "border-slate-600")
                          }
                        >
                          {st.bought && <Check size={14} className="text-slate-900" />}
                        </button>
                        <div className="flex-1 min-w-0">
                          <div className={"text-sm " + (st.bought ? "line-through text-slate-500" : "text-stone-100")}>
                            {item.name}
                            {item.low && <span className="ml-1 text-[10px] bg-rose-900/60 text-rose-200 rounded px-1.5 py-0.5">要注意</span>}
                          </div>
                          <div className="text-[10px] text-slate-500">{item.stock}</div>
                        </div>
                        <button onClick={() => changeBuyNeed(item.id, -1)} className="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center shrink-0">
                          <Minus size={13} />
                        </button>
                        <span className={"w-5 text-center text-sm font-bold " + (st.need === 0 ? "text-slate-500" : "text-amber-300")}>{st.need}</span>
                        <button onClick={() => changeBuyNeed(item.id, 1)} className="w-7 h-7 rounded-full bg-slate-700 flex items-center justify-center shrink-0">
                          <Plus size={13} />
                        </button>
                        <button onClick={() => removeBuyItem(cat.cat, item.id)} className="text-slate-600 shrink-0">
                          <X size={13} />
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}

            <div className="bg-slate-800/60 rounded-lg p-3 border border-dashed border-slate-600 space-y-2">
              <div className="text-xs text-slate-400 flex items-center gap-1">
                <Plus size={12} /> 品目を追加
              </div>
              <input
                placeholder="品名"
                className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                value={newBuyItem.name}
                onChange={(e) => setNewBuyItem((n) => ({ ...n, name: e.target.value }))}
              />
              <input
                placeholder="基準（例: 3ストック）"
                className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                value={newBuyItem.stock}
                onChange={(e) => setNewBuyItem((n) => ({ ...n, stock: e.target.value }))}
              />
              <select
                className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                value={newBuyItem.cat}
                onChange={(e) => setNewBuyItem((n) => ({ ...n, cat: e.target.value }))}
              >
                {buyLists.map((c) => (
                  <option key={c.cat} value={c.cat}>
                    {c.cat}
                  </option>
                ))}
              </select>
              <button onClick={addCustomBuyItem} className="w-full bg-amber-500 text-slate-900 rounded-lg py-2 text-sm font-bold">
                追加する
              </button>
            </div>

            <button
              onClick={sendBuyListToLine}
              disabled={buyNeedCount === 0}
              className="w-full bg-[#06C755] text-white rounded-lg py-2.5 text-sm font-bold flex items-center justify-center gap-1.5 disabled:opacity-40"
            >
              <Send size={14} /> 買い出しリストをLINEに送信{buyNeedCount > 0 ? `（${buyNeedCount}品目）` : ""}
            </button>
            <button
              onClick={copyBuyList}
              disabled={buyNeedCount === 0}
              className="w-full bg-slate-700 text-stone-100 rounded-lg py-2 text-sm font-bold flex items-center justify-center gap-1.5 disabled:opacity-40"
            >
              <Copy size={14} /> テキストをコピー
            </button>
          </div>
        )}

        {/* ============================================================
            ★ シフト管理 タブ
        ============================================================ */}
        {tab === "shift" && (
          <div className="p-3 space-y-4">
            <div className="flex items-center justify-between">
              <button onClick={() => shiftChangeMonth(-1)} className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-lg">‹</button>
              <div className="font-bold text-base">{shiftViewYM.y}年 {shiftViewYM.m + 1}月</div>
              <button onClick={() => shiftChangeMonth(1)} className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-lg">›</button>
            </div>

            {(() => {
              const { y, m } = shiftViewYM;
              const firstDow = new Date(y, m, 1).getDay();
              const daysInMonth = new Date(y, m + 1, 0).getDate();
              const cells = [];
              for (let i = 0; i < firstDow; i++) cells.push(null);
              for (let d = 1; d <= daysInMonth; d++) cells.push(d);
              const dows = ["日", "月", "火", "水", "木", "金", "土"];
              return (
                <div>
                  <div className="grid grid-cols-7 gap-1 mb-1">
                    {dows.map((d) => (
                      <div key={d} className="text-center text-[10px] text-slate-500 font-bold">{d}</div>
                    ))}
                  </div>
                  <div className="grid grid-cols-7 gap-1">
                    {cells.map((d, i) => {
                      if (!d) return <div key={i} />;
                      const key = ymd(y, m, d);
                      const list = shiftEntries[key] || [];
                      const isToday = key === todayYmd();
                      const isSel = key === shiftSelDate;
                      return (
                        <button
                          key={i}
                          onClick={() => setShiftSelDate(key)}
                          className={
                            "rounded-lg border text-left p-1 min-h-[54px] " +
                            (isSel ? "border-amber-400 bg-amber-400/10" : isToday ? "border-teal-400 bg-slate-800" : "border-slate-700 bg-slate-800")
                          }
                        >
                          <div className="text-[11px] font-bold text-slate-300">{d}</div>
                          {list.slice(0, 2).map((e) => (
                            <div key={e.id} className="text-[8px] bg-slate-700 text-amber-300 rounded px-1 truncate mt-0.5">
                              {e.staff}
                            </div>
                          ))}
                          {list.length > 2 && <div className="text-[8px] text-slate-500">+{list.length - 2}</div>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {/* 選択日パネル */}
            {(() => {
              const [y, m, d] = shiftSelDate.split("-").map(Number);
              const list = shiftEntries[shiftSelDate] || [];
              const sales = getDaySales(y, m - 1, d);
              return (
                <div className="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
                  <div className="flex items-center justify-between px-3 py-2 bg-slate-700/50">
                    <div className="font-bold text-sm">{y}年{m}月{d}日</div>
                    {sales > 0 && <div className="text-teal-300 text-xs font-bold">売上 {yen(sales)}</div>}
                  </div>
                  {list.length === 0 ? (
                    <div className="text-slate-500 text-xs text-center py-4">この日のシフトはまだありません</div>
                  ) : (
                    <div className="divide-y divide-slate-700">
                      {list.map((e) => (
                        <div key={e.id} className="flex items-center gap-2 px-3 py-2 text-sm">
                          <span className="flex-1 font-bold">{e.staff}</span>
                          <span className="text-slate-300 text-xs">{e.start}〜{e.end}</span>
                          {e.groupId && <span className="text-[9px] bg-blue-900/50 text-blue-300 rounded px-1.5 py-0.5">毎週</span>}
                          <button onClick={() => removeShiftEntry(shiftSelDate, e.id)} className="text-rose-300">
                            <X size={13} />
                          </button>
                          {e.groupId && (
                            <button onClick={() => removeShiftGroup(e.groupId)} className="text-[9px] border border-slate-600 rounded px-1.5 py-1 text-slate-300">
                              全削除
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  {shiftStaff.length === 0 ? (
                    <div className="text-slate-500 text-xs p-3">下の「スタッフ一覧」でまずスタッフを追加してください</div>
                  ) : (
                    <ShiftAddForm
                      staffList={shiftStaff}
                      shiftAddMode={shiftAddMode}
                      setShiftAddMode={setShiftAddMode}
                      onAdd={addShiftEntry}
                      dow={["日", "月", "火", "水", "木", "金", "土"][new Date(y, m - 1, d).getDay()]}
                      monthLabel={`${m}月`}
                    />
                  )}
                </div>
              );
            })()}

            {/* スタッフ管理 */}
            <div>
              <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5">スタッフ一覧（時給設定）</div>
              <div className="bg-slate-800 rounded-lg border border-slate-700 divide-y divide-slate-700">
                {shiftStaff.length === 0 && <div className="text-slate-500 text-xs text-center py-4">まだスタッフが登録されていません</div>}
                {shiftStaff.map((s) => (
                  <div key={s.name} className="flex items-center gap-2 px-3 py-2 text-sm">
                    <span className="flex-1 font-bold">{s.name}</span>
                    <span className="text-xs text-slate-400">¥</span>
                    <input
                      type="number"
                      className="w-16 bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-right text-amber-300 font-bold text-xs"
                      value={s.wage}
                      onChange={(e) => updateStaffWage(s.name, e.target.value)}
                    />
                    <span className="text-[10px] text-slate-500">/時</span>
                    <button onClick={() => removeStaff(s.name)} className="text-rose-300">
                      <X size={13} />
                    </button>
                  </div>
                ))}
              </div>
              <div className="flex gap-2 mt-2">
                <input
                  placeholder="新しいスタッフ名"
                  className="flex-1 bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                  value={newStaffName}
                  onChange={(e) => setNewStaffName(e.target.value)}
                />
                <button onClick={addStaff} className="bg-amber-500 text-slate-900 rounded-lg px-3 py-1.5 text-sm font-bold flex items-center gap-1 shrink-0">
                  <UserPlus size={14} /> 追加
                </button>
              </div>
            </div>

            {/* 月次給与明細 */}
            <div>
              <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5">月次給与明細（自動計算）</div>
              {(() => {
                const payroll = calcMonthlyPayroll(shiftViewYM.y, shiftViewYM.m);
                const names = Object.keys(payroll).sort();
                const total = names.reduce((s, n) => s + payroll[n].pay, 0);
                if (names.length === 0)
                  return <div className="bg-slate-800 rounded-lg border border-slate-700 text-slate-500 text-xs text-center py-4">この月のシフト記録がまだありません</div>;
                return (
                  <div className="bg-slate-800 rounded-lg border border-slate-700 divide-y divide-slate-700">
                    {names.map((n) => (
                      <div key={n} className="flex items-center justify-between px-3 py-2 text-sm">
                        <div>
                          <div className="font-bold">{n}</div>
                          <div className="text-[10px] text-slate-500">{payroll[n].hours.toFixed(1)}時間 × ¥{payroll[n].wage.toLocaleString()}　/　{payroll[n].shiftCount}回</div>
                        </div>
                        <div className="text-amber-300 font-bold">{yen(payroll[n].pay)}</div>
                      </div>
                    ))}
                    <div className="flex items-center justify-between px-3 py-2 bg-slate-700/50 text-sm font-bold">
                      <span>合計人件費</span>
                      <span className="text-amber-300">{yen(total)}</span>
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* 休み・出勤希望 */}
            <div>
              <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5">休み希望・出勤希望</div>
              <div className="bg-slate-800 rounded-lg border border-slate-700 p-3 space-y-2 mb-2">
                <input
                  type="date"
                  className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                  value={reqDraft.date}
                  onChange={(e) => setReqDraft((r) => ({ ...r, date: e.target.value }))}
                />
                <select
                  className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                  value={reqDraft.staff}
                  onChange={(e) => setReqDraft((r) => ({ ...r, staff: e.target.value }))}
                >
                  <option value="">担当者を選択</option>
                  {shiftStaff.map((s) => (
                    <option key={s.name} value={s.name}>{s.name}</option>
                  ))}
                </select>
                <div className="flex gap-2">
                  <button
                    onClick={() => setReqDraft((r) => ({ ...r, type: "off" }))}
                    className={"flex-1 py-2 rounded-lg text-sm font-bold border " + (reqDraft.type === "off" ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-slate-900 border-slate-700")}
                  >
                    休み希望
                  </button>
                  <button
                    onClick={() => setReqDraft((r) => ({ ...r, type: "want" }))}
                    className={"flex-1 py-2 rounded-lg text-sm font-bold border " + (reqDraft.type === "want" ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-slate-900 border-slate-700")}
                  >
                    出勤希望
                  </button>
                </div>
                <input
                  placeholder="メモ（任意）"
                  className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                  value={reqDraft.note}
                  onChange={(e) => setReqDraft((r) => ({ ...r, note: e.target.value }))}
                />
                <button onClick={submitShiftRequest} className="w-full bg-amber-500 text-slate-900 rounded-lg py-2 text-sm font-bold">
                  希望を提出する
                </button>
              </div>
              <div className="bg-slate-800 rounded-lg border border-slate-700 divide-y divide-slate-700">
                {shiftRequests.length === 0 && <div className="text-slate-500 text-xs text-center py-4">まだ提出された希望はありません</div>}
                {shiftRequests
                  .slice()
                  .reverse()
                  .map((r) => (
                    <div key={r.id} className="flex items-center gap-2 px-3 py-2 text-sm">
                      <div className="flex-1">
                        <div>{r.date}　{r.staff}</div>
                        {r.note && <div className="text-[10px] text-slate-500">{r.note}</div>}
                      </div>
                      <span className={"text-[10px] rounded px-1.5 py-0.5 font-bold " + (r.type === "off" ? "bg-rose-900/50 text-rose-200" : "bg-emerald-900/50 text-emerald-200")}>
                        {r.type === "off" ? "休み希望" : "出勤希望"}
                      </span>
                      <button onClick={() => removeShiftRequest(r.id)} className="text-rose-300">
                        <X size={13} />
                      </button>
                    </div>
                  ))}
              </div>
            </div>
          </div>
        )}

        {/* ============================================================
            ★ 経費・確定申告 タブ
        ============================================================ */}
        {tab === "expense" && (
          <div className="p-3 space-y-4">
            <div>
              <div className="text-amber-400 text-xs font-bold tracking-widest mb-1.5">よく使う経費（タップで自動入力）</div>
              <div className="flex flex-wrap gap-2">
                {QUICK_EXPENSES.map((q) => (
                  <button key={q.label} onClick={() => applyQuickExpense(q)} className="bg-amber-400/10 border border-amber-500/40 text-amber-300 rounded-full px-3 py-1.5 text-xs font-bold">
                    {q.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-slate-800 rounded-lg border border-slate-700 p-3 space-y-2">
              <div className="text-xs text-slate-400">支出日</div>
              <input
                type="date"
                className="w-full bg-slate-900 rounded px-2 py-1.5 text-sm border border-slate-700"
                value={expDraft.date}
                onChange={(e) => setExpDraft((d) => ({ ...d, date: e.target.value }))}
              />
              <div className="text-xs text-slate-400 pt-1">カテゴリ（勘定科目）</div>
              <div className="flex flex-wrap gap-1.5">
                {EXPENSE_CATEGORIES.map((c) => (
                  <button
                    key={c}
                    onClick={() => setExpDraft((d) => ({ ...d, cat: c }))}
                    className={"px-2.5 py-1.5 rounded-lg text-xs font-bold border " + (expDraft.cat === c ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-slate-900 border-slate-700 text-slate-300")}
                  >
                    {c}
                  </button>
                ))}
              </div>
              <div className="text-xs text-slate-400 pt-1">内容・摘要</div>

                ? yen(
                    modalOption.price +
                      (modalTopping !== "none" && isMorningSetItem(modalItem) ? TOPPING_ADDON[modalTopping].price : 0)
                  )
                : ""}
              ）
            </button>
            <button onClick={() => setModalItem(null)} className="w-full py-3 text-sm font-bold text-slate-500">
              閉じる
            </button>
            </div>
          </div>
        </div>
      )}

      {tab === "order" && cartLines.length > 0 && (
        <div
          ref={cartBarRef}
          className="fixed bottom-16 left-0 right-0 mx-auto max-w-md bg-stone-100 text-slate-900 rounded-t-xl px-3 pt-2 pb-1 shadow-2xl z-10"
          style={{
            backgroundImage: "radial-gradient(circle at 8px 0, transparent 6px, #f5f5f4 6px)",
            backgroundSize: "16px 12px",
            backgroundPosition: "top",
            backgroundRepeat: "repeat-x",
          }}
        >
          <div className="text-[11px] font-bold text-slate-500 pb-1">卓{activeTableId} の注文</div>
          <div className="max-h-28 overflow-y-auto text-xs divide-y divide-dashed divide-slate-300">
            {cartLines.map((l) => (
              <div key={l.key} className="flex items-center justify-between py-1">
                <span className="font-bold pr-1">{l.name}</span>
                <div className="flex items-center gap-2 shrink-0">
                  <button onClick={() => decFromCart(l.key)} className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center">
                    <Minus size={12} />
                  </button>
                  <span className="w-5 text-center">{l.qty}</span>
                  <button onClick={() => incInCart(l.key)} className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center">
                    <Plus size={12} />
                  </button>
                  <span className="w-14 text-right font-bold">{yen(l.price * l.qty)}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="flex items-center justify-between pt-1 border-t border-slate-300 mt-1">
            <div className="text-sm font-bold">合計 {yen(cartTotal)}</div>
            <button onClick={checkout} className="bg-amber-500 text-slate-900 font-bold text-sm px-4 py-2 rounded-lg flex items-center gap-1">
              <Save size={14} /> 会計する
            </button>
          </div>
        </div>
      )}

      <nav className="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex overflow-x-auto">
        {TABS.map(({ key, label, icon: Icon }) => (
          <button
            key={key}
            onClick={() => setTab(key)}
            className={"flex-1 min-w-[13%] py-2.5 flex flex-col items-center gap-0.5 text-[10px] " + (tab === key ? "text-amber-400" : "text-slate-400")}
          >
            <div className="relative">
              <Icon size={17} />
              {key === "order" && cartCount > 0 && (
                <span className="absolute -top-2 -right-2 bg-amber-400 text-slate-900 rounded-full text-[9px] w-4 h-4 flex items-center justify-center font-bold">
                  {cartCount}
                </span>
              )}
            </div>
            {label}
          </button>
        ))}
      </nav>
    </div>
  );
}

/* ============================================================
   シフト追加フォーム（毎週固定 / この日だけ の切り替え）
   ============================================================ */
function ShiftAddForm({ staffList, shiftAddMode, setShiftAddMode, onAdd, dow, monthLabel }) {
  const [staff, setStaff] = useState(staffList[0]?.name || "");
  const [start, setStart] = useState("07:00");
  const [end, setEnd] = useState("12:00");

  useEffect(() => {
    if (!staffList.find((s) => s.name === staff)) setStaff(staffList[0]?.name || "");
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [staffList]);

  return (
    <div className="p-3 bg-slate-900/40 space-y-2">
      <select value={staff} onChange={(e) => setStaff(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm">
        {staffList.map((s) => (
          <option key={s.name} value={s.name}>{s.name}</option>
        ))}
      </select>
      <div className="flex gap-2">
        <input type="time" value={start} onChange={(e) => setStart(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm" />
        <input type="time" value={end} onChange={(e) => setEnd(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-sm" />
      </div>
      <div className="flex gap-2">
        <button
          onClick={() => setShiftAddMode("once")}
          className={"flex-1 py-1.5 rounded-lg text-xs font-bold border " + (shiftAddMode === "once" ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-slate-900 border-slate-700 text-slate-300")}
        >
          この日だけ
        </button>
        <button
          onClick={() => setShiftAddMode("weekly")}
          className={"flex-1 py-1.5 rounded-lg text-xs font-bold border " + (shiftAddMode === "weekly" ? "bg-amber-400 text-slate-900 border-amber-500" : "bg-slate-900 border-slate-700 text-slate-300")}
        >
          曜日固定（毎週）
        </button>
      </div>
      {shiftAddMode === "weekly" && (
        <div className="text-[10px] text-slate-400 leading-relaxed">
          この日（{dow}曜日）から{monthLabel}末まで、毎週同じ曜日・同じ時間でまとめて登録します
        </div>
      )}
      <button onClick={() => onAdd(staff, start, end)} className="w-full bg-amber-500 text-slate-900 rounded-lg py-2 text-sm font-bold">
        ＋ シフトを追加
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PosRegister />);

</script>

</body>
</html>
