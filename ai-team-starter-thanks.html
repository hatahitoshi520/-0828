<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AI Team Starter | ご購入ありがとうございます</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{--bg:#08090f;--panel:#12141f;--border:rgba(255,255,255,.08);--text:#f3f4f8;--dim:#9498ab;--accent:#35d4c7;
    --grad:linear-gradient(135deg,#ff9f43,#7c5cff 55%,#35d4c7)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:48px 16px 96px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:28px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;border:0;cursor:pointer;background:var(--grad);color:#08090f}
  .dim{color:var(--dim);font-size:14px}
  h1{font-size:clamp(24px,4vw,32px);line-height:1.4;margin:0 0 10px}
  #guide h2{margin-top:44px;font-size:22px;border-bottom:1px solid var(--border);padding-bottom:8px}
  #guide h3{margin-top:28px;font-size:17px;color:var(--accent)}
  #guide pre{background:#05060a;border:1px solid var(--border);border-radius:12px;padding:16px;overflow-x:auto;font-size:12.5px;line-height:1.6}
  #guide code{font-family:"JetBrains Mono",monospace}
  #guide :not(pre)>code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;font-size:.9em}
  #guide table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
  #guide th,#guide td{border:1px solid var(--border);padding:8px 10px;text-align:left}
  #guide blockquote{border-left:3px solid var(--accent);margin:0;padding:4px 16px;color:var(--dim)}
  .error{color:#ff7b9c}
</style>
</head>
<body>
<div class="wrap">
  <div id="status" class="card"><p>お支払いを確認しています…</p></div>
  <div id="content" hidden>
    <div class="card">
      <h1>ご購入ありがとうございます</h1>
      <p class="dim">このページをブックマークしておくと、いつでも再ダウンロードできます。</p>
      <button id="download" class="btn">設定ファイル一式をダウンロード（zip）</button>
    </div>
    <article id="guide"></article>
  </div>
</div>
<script>
const FUNCTION_URL = "https://beeyqtqhlhglrxppqbvb.supabase.co/functions/v1/ai-team-shop";
const statusEl = document.getElementById("status");

function showError(msg) {
  statusEl.innerHTML = "";
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = msg;
  statusEl.appendChild(p);
}

async function load(retry = 0) {
  const sessionId = new URLSearchParams(location.search).get("session_id");
  if (!sessionId) return showError("購入情報が見つかりません。決済完了後に表示されたページのURLを開いてください。");
  try {
    const res = await fetch(`${FUNCTION_URL}?action=deliver&session_id=${encodeURIComponent(sessionId)}`);
    const data = await res.json();
    // 決済直後は Stripe 側の確定が数秒遅れることがあるので、少し待って再確認する
    if (res.status === 402 && retry < 5) return setTimeout(() => load(retry + 1), 3000);
    if (!res.ok) return showError(data.error || "読み込みに失敗しました。");
    document.getElementById("guide").innerHTML = marked.parse(data.guide);
    document.getElementById("download").onclick = async () => {
      const zip = new JSZip();
      for (const [path, text] of Object.entries(data.files)) zip.file(`ai-team-starter/${path}`, text);
      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ai-team-starter.zip";
      a.click();
    };
    statusEl.hidden = true;
    document.getElementById("content").hidden = false;
  } catch (e) {
    showError("通信に失敗しました。ページを再読み込みしてください。");
  }
}
load();
</script>
</body>
</html>
